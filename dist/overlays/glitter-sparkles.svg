<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="sparkleCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="holoSparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0e7ff" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pinkSparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fce7f3" />
      <stop offset="70%" stop-color="#f472b6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 4-Point Starburst (Y2K Classic) -->
    <g id="star4">
      <circle cx="0" cy="0" r="14" fill="url(#sparkleCore)" />
      <path d="M 0 -26 Q 0 0 26 0 Q 0 0 0 26 Q 0 0 -26 0 Q 0 0 0 -26 Z" fill="#ffffff" filter="url(#starGlow)" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>

    <!-- 8-Point Diamond Star -->
    <g id="star8">
      <circle cx="0" cy="0" r="18" fill="url(#holoSparkle)" />
      <path d="M 0 -32 Q 0 0 32 0 Q 0 0 0 32 Q 0 0 -32 0 Q 0 0 0 -32 Z" fill="#ffffff" filter="url(#starGlow)" />
      <path d="M -14 -14 Q 0 0 14 -14 Q 0 0 14 14 Q 0 0 -14 14 Q 0 0 -14 -14 Z" fill="#fef08a" opacity="0.85" />
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    </g>

    <!-- Twinkle Cluster -->
    <g id="twinkleCluster">
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
      <circle cx="-12" cy="8" r="1.5" fill="#fef08a" />
      <circle cx="10" cy="-10" r="2" fill="#c084fc" />
      <polygon points="0,-10 2,-2 10,0 2,2 0,10 -2,2 -10,0 -2,-2" fill="#ffffff" transform="translate(14, 12) scale(0.6)" />
    </g>
  </defs>

  <!-- Large Feature Stars around the borders and top -->
  <use href="#star8" transform="translate(75, 90) scale(1.1) rotate(12)" />
  <use href="#star4" transform="translate(180, 50) scale(0.85) rotate(-15)" />
  <use href="#star4" transform="translate(420, 60) scale(0.95) rotate(20)" />
  <use href="#star8" transform="translate(525, 100) scale(1.05) rotate(-10)" />

  <!-- Side Sparkles (Elevating selfie edges) -->
  <use href="#star4" transform="translate(45, 230) scale(0.8) rotate(45)" />
  <use href="#star8" transform="translate(65, 360) scale(0.9) rotate(25)" />
  <use href="#star4" transform="translate(50, 490) scale(0.75) rotate(-30)" />

  <use href="#star4" transform="translate(555, 210) scale(0.85) rotate(-25)" />
  <use href="#star8" transform="translate(535, 340) scale(0.95) rotate(15)" />
  <use href="#star4" transform="translate(550, 480) scale(0.8) rotate(35)" />

  <!-- Bottom Stars and Sparkle Trail -->
  <use href="#star8" transform="translate(90, 710) scale(1.15) rotate(18)" />
  <use href="#star4" transform="translate(200, 750) scale(0.85) rotate(-12)" />
  <use href="#star4" transform="translate(400, 745) scale(0.9) rotate(22)" />
  <use href="#star8" transform="translate(510, 700) scale(1.1) rotate(-15)" />

  <!-- Twinkle Clusters scattered naturally -->
  <use href="#twinkleCluster" transform="translate(120, 150) scale(1.1)" />
  <use href="#twinkleCluster" transform="translate(470, 160) scale(1.0)" />
  <use href="#twinkleCluster" transform="translate(100, 290) scale(0.9)" />
  <use href="#twinkleCluster" transform="translate(500, 270) scale(1.05)" />
  <use href="#twinkleCluster" transform="translate(110, 430) scale(0.95)" />
  <use href="#twinkleCluster" transform="translate(490, 430) scale(1.1)" />
  <use href="#twinkleCluster" transform="translate(140, 630) scale(1.0)" />
  <use href="#twinkleCluster" transform="translate(460, 620) scale(1.05)" />

  <!-- Bokeh Fairy Dust Flecks -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="270" cy="40" r="2" />
    <circle cx="330" cy="50" r="3" />
    <circle cx="80" cy="180" r="1.5" />
    <circle cx="520" cy="180" r="2" />
    <circle cx="30" cy="410" r="2.5" />
    <circle cx="570" cy="410" r="2" />
    <circle cx="280" cy="760" r="2" />
    <circle cx="320" cy="765" r="3" />
  </g>
</svg>
