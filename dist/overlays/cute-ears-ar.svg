<svg xmlns="http://www.w3.org/2000/svg" viewBox="-180 -180 360 260" width="360" height="260">
  <defs>
    <linearGradient id="arEarOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <linearGradient id="arEarInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="60%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>
    <radialGradient id="arBlushGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#f43f5e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>
    <filter id="arEarShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Cute Cat / Bunny Ears (Anchor point is 0, 0 at the forehead hairline) -->
  <g filter="url(#arEarShadow)">
    <!-- LEFT EAR -->
    <g transform="translate(-85, -20) rotate(-16)">
      <!-- Outer Ear -->
      <path d="M -40 30 C -45 -20 -22 -110 0 -130 C 22 -110 42 -20 38 30 Z" fill="url(#arEarOuter)" stroke="#e5e7eb" stroke-width="2.5" />
      <!-- Inner Pink Pad -->
      <path d="M -26 22 C -30 -12 -15 -90 0 -108 C 15 -90 28 -12 24 22 Z" fill="url(#arEarInner)" />
      <!-- Inner Fluff Highlight -->
      <path d="M -12 5 Q 0 -15 12 5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.65" />
      <!-- Cute Bow on Ear Base -->
      <circle cx="24" cy="25" r="7" fill="#fb7185" />
      <circle cx="36" cy="25" r="7" fill="#fb7185" />
      <circle cx="30" cy="25" r="4" fill="#fef08a" />
    </g>

    <!-- RIGHT EAR -->
    <g transform="translate(85, -20) rotate(16)">
      <!-- Outer Ear -->
      <path d="M -38 30 C -42 -20 -22 -110 0 -130 C 22 -110 45 -20 40 30 Z" fill="url(#arEarOuter)" stroke="#e5e7eb" stroke-width="2.5" />
      <!-- Inner Pink Pad -->
      <path d="M -24 22 C -28 -12 -15 -90 0 -108 C 15 -90 30 -12 26 22 Z" fill="url(#arEarInner)" />
      <!-- Inner Fluff Highlight -->
      <path d="M -12 5 Q 0 -15 12 5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.65" />
      <!-- Cute Bow on Ear Base -->
      <circle cx="-24" cy="25" r="7" fill="#fb7185" />
      <circle cx="-36" cy="25" r="7" fill="#fb7185" />
      <circle cx="-30" cy="25" r="4" fill="#fef08a" />
    </g>

    <!-- Little Star Sparkles Between Ears -->
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#ffffff" transform="translate(0, -60) scale(0.9)" />
    <polygon points="0,-10 2,-2 10,0 2,2 0,10 -2,2 -10,0 -2,-2" fill="#fef08a" transform="translate(-35, -45) scale(0.6)" />
    <polygon points="0,-10 2,-2 10,0 2,2 0,10 -2,2 -10,0 -2,-2" fill="#fef08a" transform="translate(35, -45) scale(0.6)" />
  </g>
</svg>
