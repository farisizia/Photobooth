<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="peachRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="50%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="yellowDaisy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="60%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="70%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fde047" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>

    <!-- Mini Rose Symbol -->
    <g id="miniRose">
      <circle cx="0" cy="0" r="14" fill="url(#roseGrad)" />
      <path d="M -8 -4 C -6 -11 6 -11 8 -4 C 10 4 2 10 -4 9 C -9 8 -11 1 -8 -4" fill="none" stroke="#ffe4e6" stroke-width="2.5" stroke-linecap="round" />
      <path d="M -4 -1 C -2 -5 4 -5 5 -1 C 5 3 1 5 -2 5" fill="none" stroke="#fff1f2" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Daisy Flower Symbol -->
    <g id="daisyFlower">
      <!-- 8 Petals -->
      <ellipse cx="0" cy="-12" rx="4.5" ry="9" fill="#ffffff" />
      <ellipse cx="0" cy="12" rx="4.5" ry="9" fill="#ffffff" />
      <ellipse cx="-12" cy="0" rx="9" ry="4.5" fill="#ffffff" />
      <ellipse cx="12" cy="0" rx="9" ry="4.5" fill="#ffffff" />
      <ellipse cx="-8.5" cy="-8.5" rx="5" ry="8.5" fill="#fdf4ff" transform="rotate(45 -8.5 -8.5)" />
      <ellipse cx="8.5" cy="-8.5" rx="5" ry="8.5" fill="#fdf4ff" transform="rotate(-45 8.5 -8.5)" />
      <ellipse cx="-8.5" cy="8.5" rx="5" ry="8.5" fill="#fdf4ff" transform="rotate(-45 -8.5 8.5)" />
      <ellipse cx="8.5" cy="8.5" rx="5" ry="8.5" fill="#fdf4ff" transform="rotate(45 8.5 8.5)" />
      <circle cx="0" cy="0" r="6" fill="url(#yellowDaisy)" />
    </g>

    <!-- Leaf Pair Symbol -->
    <g id="leafPair">
      <path d="M 0 0 C -12 -10 -15 -22 0 -30 C 15 -22 12 -10 0 0" fill="url(#leafGrad)" />
      <path d="M 0 -30 L 0 0" stroke="#166534" stroke-width="1" opacity="0.6" />
    </g>
  </defs>

  <!-- Crown Arch / Vine Band (Curving gracefully across the head zone: x:130 to 470, y:120 to 160) -->
  <g id="crownStructure">
    <!-- Golden Vine Swirls -->
    <path d="M 120 160 Q 300 115 480 160" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <path d="M 140 170 Q 300 125 460 170" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- Greenery Leaf Accents Along the Vine -->
    <use href="#leafPair" transform="translate(150, 160) rotate(-55) scale(0.6)" />
    <use href="#leafPair" transform="translate(190, 145) rotate(-35) scale(0.65)" />
    <use href="#leafPair" transform="translate(230, 133) rotate(-20) scale(0.7)" />
    <use href="#leafPair" transform="translate(270, 125) rotate(-5) scale(0.75)" />
    <use href="#leafPair" transform="translate(330, 125) rotate(5) scale(0.75)" />
    <use href="#leafPair" transform="translate(370, 133) rotate(20) scale(0.7)" />
    <use href="#leafPair" transform="translate(410, 145) rotate(35) scale(0.65)" />
    <use href="#leafPair" transform="translate(450, 160) rotate(55) scale(0.6)" />

    <!-- Left Flank Flowers -->
    <use href="#miniRose" transform="translate(160, 162) scale(0.85)" />
    <use href="#daisyFlower" transform="translate(200, 148) scale(0.9)" />
    <use href="#miniRose" transform="translate(245, 135) scale(1.05)" />

    <!-- CENTER PIECE (Largest Rose & Surrounding Daisies) -->
    <use href="#daisyFlower" transform="translate(275, 126) scale(0.95)" />
    <!-- Center Grand Rose -->
    <g transform="translate(300, 120) scale(1.35)">
      <circle cx="0" cy="0" r="16" fill="url(#peachRose)" />
      <path d="M -9 -4 C -7 -13 7 -13 9 -4 C 11 5 2 12 -5 11 C -11 9 -13 2 -9 -4" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
      <path d="M -4 -1 C -2 -6 4 -6 6 -1 C 6 4 1 6 -2 6" fill="none" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round" />
      <!-- Star Sparkle on Rose -->
      <polygon points="0,-18 3,-4 17,0 3,4 0,18 -3,4 -17,0 -3,-4" fill="#ffffff" opacity="0.85" transform="translate(12, -10) scale(0.4)" />
    </g>
    <use href="#daisyFlower" transform="translate(325, 126) scale(0.95)" />

    <!-- Right Flank Flowers -->
    <use href="#miniRose" transform="translate(355, 135) scale(1.05)" />
    <use href="#daisyFlower" transform="translate(400, 148) scale(0.9)" />
    <use href="#miniRose" transform="translate(440, 162) scale(0.85)" />

    <!-- Baby's Breath / Little Pearl Accents -->
    <g fill="#ffffff" opacity="0.9">
      <circle cx="175" cy="152" r="3" />
      <circle cx="180" cy="157" r="2" />
      <circle cx="220" cy="138" r="3.5" />
      <circle cx="260" cy="128" r="3" />
      <circle cx="340" cy="128" r="3" />
      <circle cx="380" cy="138" r="3.5" />
      <circle cx="420" cy="152" r="3" />
      <circle cx="425" cy="157" r="2" />
    </g>

    <!-- Fairy Sparkles Around the Crown -->
    <polygon points="0,-10 2,-2 10,0 2,2 0,10 -2,2 -10,0 -2,-2" fill="#fef08a" opacity="0.9" transform="translate(210, 115) scale(0.7)" />
    <polygon points="0,-10 2,-2 10,0 2,2 0,10 -2,2 -10,0 -2,-2" fill="#fef08a" opacity="0.9" transform="translate(390, 115) scale(0.7)" />
    <polygon points="0,-10 2,-2 10,0 2,2 0,10 -2,2 -10,0 -2,-2" fill="#ffffff" opacity="0.9" transform="translate(300, 90) scale(0.8)" />
    <polygon points="0,-10 2,-2 10,0 2,2 0,10 -2,2 -10,0 -2,-2" fill="#fbcfe8" opacity="0.8" transform="translate(135, 145) scale(0.5)" />
    <polygon points="0,-10 2,-2 10,0 2,2 0,10 -2,2 -10,0 -2,-2" fill="#fbcfe8" opacity="0.8" transform="translate(465, 145) scale(0.5)" />
  </g>
</svg>
