<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Ear Gradients -->
    <linearGradient id="earOuterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <linearGradient id="earInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="70%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>
    <radialGradient id="blushGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#f43f5e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>
    <filter id="softEarShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity="0.25" />
    </filter>

    <!-- Sparkle Star Symbol -->
    <g id="sparkleDoodle">
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#fbcfe8" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>
  </defs>

  <!-- Cute Cat / Bunny Ears (Top Center positioned for selfie head: y: 40 to 180, x: 190 and 410) -->
  <g filter="url(#softEarShadow)">
    <!-- LEFT EAR -->
    <g transform="translate(200, 110) rotate(-18)">
      <!-- Outer White Ear -->
      <path d="M -45 60 C -50 10 -25 -65 0 -85 C 25 -65 50 10 45 60 Z" fill="url(#earOuterGrad)" stroke="#e5e7eb" stroke-width="2" />
      <!-- Inner Pink Pad -->
      <path d="M -30 50 C -34 15 -16 -45 0 -62 C 16 -45 34 15 30 50 Z" fill="url(#earInnerGrad)" opacity="0.9" />
      <!-- Soft Inner Fluff Highlight -->
      <path d="M -15 35 Q 0 15 15 35" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
      <!-- Mini Bow or Flower on Ear Base -->
      <circle cx="28" cy="55" r="7" fill="#fb7185" />
      <circle cx="40" cy="55" r="7" fill="#fb7185" />
      <circle cx="34" cy="55" r="4" fill="#fef08a" />
    </g>

    <!-- RIGHT EAR -->
    <g transform="translate(400, 110) rotate(18)">
      <!-- Outer White Ear -->
      <path d="M -45 60 C -50 10 -25 -65 0 -85 C 25 -65 50 10 45 60 Z" fill="url(#earOuterGrad)" stroke="#e5e7eb" stroke-width="2" />
      <!-- Inner Pink Pad -->
      <path d="M -30 50 C -34 15 -16 -45 0 -62 C 16 -45 34 15 30 50 Z" fill="url(#earInnerGrad)" opacity="0.9" />
      <!-- Soft Inner Fluff Highlight -->
      <path d="M -15 35 Q 0 15 15 35" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
      <!-- Mini Bow or Flower on Ear Base -->
      <circle cx="-28" cy="55" r="7" fill="#fb7185" />
      <circle cx="-40" cy="55" r="7" fill="#fb7185" />
      <circle cx="-34" cy="55" r="4" fill="#fef08a" />
    </g>
  </g>

  <!-- Sparkles around the ears -->
  <use href="#sparkleDoodle" transform="translate(130, 80) scale(0.9) rotate(15)" />
  <use href="#sparkleDoodle" transform="translate(300, 60) scale(1.1)" />
  <use href="#sparkleDoodle" transform="translate(470, 80) scale(0.9) rotate(-15)" />

  <!-- Cute Whiskers & Blush Cheeks (Selfie Cheek Zones: y around 380-420, x: 140 & 460) -->
  <!-- Left Cheek Blush -->
  <circle cx="150" cy="400" r="32" fill="url(#blushGlow)" />
  <!-- Left Cute Whiskers -->
  <path d="M 120 390 Q 70 380 40 375" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <path d="M 120 402 Q 65 402 35 405" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <path d="M 120 415 Q 70 422 45 432" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Right Cheek Blush -->
  <circle cx="450" cy="400" r="32" fill="url(#blushGlow)" />
  <!-- Right Cute Whiskers -->
  <path d="M 480 390 Q 530 380 560 375" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <path d="M 480 402 Q 535 402 565 405" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <path d="M 480 415 Q 530 422 555 432" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Tiny Heart Details -->
  <path d="M 150 365 C 145 355 130 360 130 370 C 130 380 150 392 150 392 C 150 392 170 380 170 370 C 170 360 155 355 150 365 Z" fill="#fb7185" opacity="0.75" transform="scale(0.65) translate(80, 200)" />
  <path d="M 150 365 C 145 355 130 360 130 370 C 130 380 150 392 150 392 C 150 392 170 380 170 370 C 170 360 155 355 150 365 Z" fill="#fb7185" opacity="0.75" transform="scale(0.65) translate(540, 200)" />
</svg>
