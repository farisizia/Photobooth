<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Gradients for Sakura Petals -->
    <linearGradient id="sakuraGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f5" />
      <stop offset="60%" stop-color="#ffb7c5" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="sakuraGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="sakuraCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="60%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </radialGradient>
    <filter id="sakuraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Single 5-petal Sakura Flower Symbol -->
    <g id="sakuraFlower">
      <g filter="url(#sakuraGlow)">
        <!-- 5 Petals -->
        <path d="M 0 0 C -12 -22 -16 -38 0 -48 C 16 -38 12 -22 0 0" fill="url(#sakuraGrad1)" />
        <path d="M 0 0 C -12 -22 -16 -38 0 -48 C 16 -38 12 -22 0 0" fill="url(#sakuraGrad1)" transform="rotate(72)" />
        <path d="M 0 0 C -12 -22 -16 -38 0 -48 C 16 -38 12 -22 0 0" fill="url(#sakuraGrad2)" transform="rotate(144)" />
        <path d="M 0 0 C -12 -22 -16 -38 0 -48 C 16 -38 12 -22 0 0" fill="url(#sakuraGrad1)" transform="rotate(216)" />
        <path d="M 0 0 C -12 -22 -16 -38 0 -48 C 16 -38 12 -22 0 0" fill="url(#sakuraGrad2)" transform="rotate(288)" />
      </g>
      <!-- Center Pistil & Stamens -->
      <circle cx="0" cy="0" r="6" fill="url(#sakuraCenter)" />
      <circle cx="-3" cy="-3" r="1.5" fill="#fef08a" />
      <circle cx="3" cy="-3" r="1.5" fill="#fef08a" />
      <circle cx="4" cy="2" r="1.5" fill="#fef08a" />
      <circle cx="-2" cy="4" r="1.5" fill="#fef08a" />
    </g>

    <!-- Single Falling Petal -->
    <g id="singlePetal">
      <path d="M 0 0 C -10 -15 -14 -28 0 -36 C 14 -28 10 -15 0 0" fill="url(#sakuraGrad1)" opacity="0.9" />
    </g>
  </defs>

  <!-- Top-Left Blossom Branch Cluster -->
  <g transform="translate(10, 10)">
    <!-- Branch twig -->
    <path d="M -10 -10 Q 50 40 130 50 Q 180 55 210 30" stroke="#78350f" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6" />
    <path d="M 60 42 Q 80 80 120 95" stroke="#78350f" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6" />
    <path d="M 130 50 Q 150 75 170 80" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5" />

    <!-- Sakura Flowers on Top Left -->
    <use href="#sakuraFlower" transform="translate(30, 25) scale(1.1) rotate(15)" />
    <use href="#sakuraFlower" transform="translate(85, 45) scale(0.95) rotate(-25)" />
    <use href="#sakuraFlower" transform="translate(140, 52) scale(1.15) rotate(40)" />
    <use href="#sakuraFlower" transform="translate(195, 35) scale(0.8) rotate(100)" />
    <use href="#sakuraFlower" transform="translate(115, 95) scale(0.75) rotate(-45)" />
    <use href="#sakuraFlower" transform="translate(165, 80) scale(0.65) rotate(15)" />

    <!-- Leaves -->
    <path d="M 45 15 C 35 5 50 -10 60 0 C 55 10 50 15 45 15" fill="#86efac" opacity="0.8" />
    <path d="M 105 35 C 100 20 115 10 125 25 C 118 35 110 35 105 35" fill="#4ade80" opacity="0.85" />
    <path d="M 160 45 C 170 30 185 40 180 55 C 170 55 165 50 160 45" fill="#86efac" opacity="0.8" />
  </g>

  <!-- Top-Right Blossom Cluster -->
  <g transform="translate(590, 10)">
    <path d="M 10 -10 Q -50 35 -120 45 Q -170 50 -195 25" stroke="#78350f" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.6" />
    <use href="#sakuraFlower" transform="translate(-40, 25) scale(1.05) rotate(-20)" />
    <use href="#sakuraFlower" transform="translate(-105, 40) scale(0.9) rotate(35)" />
    <use href="#sakuraFlower" transform="translate(-160, 48) scale(0.85) rotate(-55)" />
    <path d="M -75 25 C -70 10 -85 5 -95 18 C -90 28 -80 28 -75 25" fill="#86efac" opacity="0.8" />
  </g>

  <!-- Floating Falling Petals -->
  <use href="#singlePetal" transform="translate(70, 180) rotate(45) scale(0.9)" />
  <use href="#singlePetal" transform="translate(160, 240) rotate(-30) scale(0.75)" />
  <use href="#singlePetal" transform="translate(480, 150) rotate(70) scale(0.85)" />
  <use href="#singlePetal" transform="translate(530, 280) rotate(-50) scale(0.7)" />
  <use href="#singlePetal" transform="translate(110, 420) rotate(25) scale(0.8)" />
  <use href="#singlePetal" transform="translate(510, 490) rotate(-15) scale(0.75)" />

  <!-- Bottom-Left Cluster -->
  <g transform="translate(0, 790)">
    <path d="M -10 10 Q 40 -30 90 -40 Q 140 -45 160 -20" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5" />
    <use href="#sakuraFlower" transform="translate(35, -30) scale(0.95) rotate(50)" />
    <use href="#sakuraFlower" transform="translate(90, -42) scale(0.8) rotate(-10)" />
    <use href="#sakuraFlower" transform="translate(145, -25) scale(0.7) rotate(85)" />
    <use href="#singlePetal" transform="translate(180, -60) rotate(60) scale(0.8)" />
  </g>

  <!-- Bottom-Right Blossom Frame Accent -->
  <g transform="translate(600, 800)">
    <path d="M 10 10 Q -45 -35 -110 -45 Q -160 -50 -180 -25" stroke="#78350f" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.6" />
    <use href="#sakuraFlower" transform="translate(-40, -35) scale(1.1) rotate(-40)" />
    <use href="#sakuraFlower" transform="translate(-105, -45) scale(0.9) rotate(25)" />
    <use href="#sakuraFlower" transform="translate(-160, -28) scale(0.75) rotate(-65)" />
    <path d="M -80 -40 C -70 -55 -85 -60 -95 -48 C -90 -40 -82 -38 -80 -40" fill="#86efac" opacity="0.8" />
  </g>
</svg>
