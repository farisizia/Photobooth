<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -50 300 100" width="300" height="100">
  <defs>
    <!-- Lens Gradient (Sunset Y2K Tint) -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.85" />
    </linearGradient>

    <!-- Metallic Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Glass Reflection Highlight Gradient -->
    <linearGradient id="reflectionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="glassesGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#glassesGlow)">
    <!-- LEFT LENS & FRAME -->
    <g id="leftEyeSide">
      <!-- Outer Frame -->
      <path d="M -22 -14 C -35 -24 -95 -24 -120 -10 C -142 2 -135 32 -100 36 C -60 40 -28 20 -18 -4 Z" fill="url(#frameGrad)" stroke="#fef08a" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Inner Lens Glass -->
      <path d="M -26 -11 C -38 -20 -92 -20 -115 -8 C -135 3 -128 28 -98 32 C -63 36 -32 18 -22 -2 Z" fill="url(#lensGrad)" />
      <!-- Lens Diagonal Reflection Glare -->
      <path d="M -105 -12 L -75 -18 L -90 28 L -120 30 Z" fill="url(#reflectionGrad)" opacity="0.6" />
      <path d="M -65 -18 L -52 -18 L -62 26 L -75 27 Z" fill="url(#reflectionGrad)" opacity="0.4" />
      <!-- Mini Sparkle on Corner -->
      <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" fill="#ffffff" transform="translate(-115, -12) scale(0.6)" />
    </g>

    <!-- NOSE BRIDGE (Center Anchor at 0, 0) -->
    <path d="M -22 -12 Q 0 -22 22 -12" fill="none" stroke="url(#frameGrad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M -18 -3 Q 0 -11 18 -3" fill="none" stroke="url(#frameGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7" />

    <!-- RIGHT LENS & FRAME -->
    <g id="rightEyeSide">
      <!-- Outer Frame -->
      <path d="M 22 -14 C 35 -24 95 -24 120 -10 C 142 2 135 32 100 36 C 60 40 28 20 18 -4 Z" fill="url(#frameGrad)" stroke="#fef08a" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Inner Lens Glass -->
      <path d="M 26 -11 C 38 -20 92 -20 115 -8 C 135 3 128 28 98 32 C 63 36 32 18 22 -2 Z" fill="url(#lensGrad)" />
      <!-- Lens Diagonal Reflection Glare -->
      <path d="M 105 -12 L 75 -18 L 90 28 L 120 30 Z" fill="url(#reflectionGrad)" opacity="0.6" />
      <path d="M 65 -18 L 52 -18 L 62 26 L 75 27 Z" fill="url(#reflectionGrad)" opacity="0.4" />
      <!-- Mini Sparkle on Corner -->
      <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" fill="#ffffff" transform="translate(115, -12) scale(0.6)" />
    </g>

    <!-- Temples / Side Hinges -->
    <path d="M -122 -8 L -142 -12" stroke="url(#frameGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M 122 -8 L 142 -12" stroke="url(#frameGrad)" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
