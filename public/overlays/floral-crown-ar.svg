<svg xmlns="http://www.w3.org/2000/svg" viewBox="-180 -120 360 160" width="360" height="160">
  <defs>
    <linearGradient id="arCrownRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="arCrownDaisy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="60%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="arCrownLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="70%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="arCrownShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <g id="arMiniRose">
      <circle cx="0" cy="0" r="14" fill="url(#arCrownRose)" />
      <path d="M -8 -4 C -6 -11 6 -11 8 -4 C 10 4 2 10 -4 9 C -9 8 -11 1 -8 -4" fill="none" stroke="#ffe4e6" stroke-width="2.5" stroke-linecap="round" />
      <path d="M -4 -1 C -2 -5 4 -5 5 -1 C 5 3 1 5 -2 5" fill="none" stroke="#fff1f2" stroke-width="2" stroke-linecap="round" />
    </g>

    <g id="arDaisy">
      <ellipse cx="0" cy="-11" rx="4" ry="8" fill="#ffffff" />
      <ellipse cx="0" cy="11" rx="4" ry="8" fill="#ffffff" />
      <ellipse cx="-11" cy="0" rx="8" ry="4" fill="#ffffff" />
      <ellipse cx="11" cy="0" rx="8" ry="4" fill="#ffffff" />
      <ellipse cx="-7.5" cy="-7.5" rx="4.5" ry="7.5" fill="#fdf4ff" transform="rotate(45 -7.5 -7.5)" />
      <ellipse cx="7.5" cy="-7.5" rx="4.5" ry="7.5" fill="#fdf4ff" transform="rotate(-45 7.5 -7.5)" />
      <ellipse cx="-7.5" cy="7.5" rx="4.5" ry="7.5" fill="#fdf4ff" transform="rotate(-45 -7.5 7.5)" />
      <ellipse cx="7.5" cy="7.5" rx="4.5" ry="7.5" fill="#fdf4ff" transform="rotate(45 7.5 7.5)" />
      <circle cx="0" cy="0" r="5.5" fill="url(#arCrownDaisy)" />
    </g>

    <g id="arLeaf">
      <path d="M 0 0 C -10 -8 -12 -18 0 -24 C 12 -18 10 -8 0 0" fill="url(#arCrownLeaf)" />
    </g>
  </defs>

  <!-- Crown Arch (Origin 0, 0 is at bottom center of the crown arch on forehead) -->
  <g filter="url(#arCrownShadow)">
    <!-- Golden & Green Arch Vines -->
    <path d="M -150 15 Q 0 -35 150 15" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <path d="M -135 25 Q 0 -25 135 25" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

    <!-- Foliage Leaves Along Vine -->
    <use href="#arLeaf" transform="translate(-130, 15) rotate(-55) scale(0.65)" />
    <use href="#arLeaf" transform="translate(-90, -2) rotate(-35) scale(0.7)" />
    <use href="#arLeaf" transform="translate(-50, -18) rotate(-15) scale(0.75)" />
    <use href="#arLeaf" transform="translate(50, -18) rotate(15) scale(0.75)" />
    <use href="#arLeaf" transform="translate(90, -2) rotate(35) scale(0.7)" />
    <use href="#arLeaf" transform="translate(130, 15) rotate(55) scale(0.65)" />

    <!-- Left Flank Flowers -->
    <use href="#arMiniRose" transform="translate(-120, 16) scale(0.85)" />
    <use href="#arDaisy" transform="translate(-85, 2) scale(0.9)" />
    <use href="#arMiniRose" transform="translate(-45, -12) scale(1.05)" />

    <!-- CENTER PIECE (Grand Rose & Side Daisies) -->
    <use href="#arDaisy" transform="translate(-20, -22) scale(0.95)" />
    <!-- Center Grand Rose -->
    <g transform="translate(0, -30) scale(1.35)">
      <circle cx="0" cy="0" r="16" fill="url(#arCrownRose)" />
      <path d="M -9 -4 C -7 -13 7 -13 9 -4 C 11 5 2 12 -5 11 C -11 9 -13 2 -9 -4" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
      <path d="M -4 -1 C -2 -6 4 -6 6 -1 C 6 4 1 6 -2 6" fill="none" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round" />
      <polygon points="0,-16 3,-3 15,0 3,3 0,16 -3,3 -15,0 -3,-3" fill="#ffffff" opacity="0.85" transform="translate(10, -9) scale(0.35)" />
    </g>
    <use href="#arDaisy" transform="translate(20, -22) scale(0.95)" />

    <!-- Right Flank Flowers -->
    <use href="#arMiniRose" transform="translate(45, -12) scale(1.05)" />
    <use href="#arDaisy" transform="translate(85, 2) scale(0.9)" />
    <use href="#arMiniRose" transform="translate(120, 16) scale(0.85)" />

    <!-- Pearls and Sparkles -->
    <circle cx="-105, 8" r="3" fill="#ffffff" opacity="0.9" />
    <circle cx="-65, -8" r="3" fill="#ffffff" opacity="0.9" />
    <circle cx="65, -8" r="3" fill="#ffffff" opacity="0.9" />
    <circle cx="105, 8" r="3" fill="#ffffff" opacity="0.9" />

    <polygon points="0,-9 2,-2 9,0 2,2 0,9 -2,2 -9,0 -2,-2" fill="#fef08a" transform="translate(-75, -25) scale(0.65)" />
    <polygon points="0,-9 2,-2 9,0 2,2 0,9 -2,2 -9,0 -2,-2" fill="#fef08a" transform="translate(75, -25) scale(0.65)" />
    <polygon points="0,-10 2,-2 10,0 2,2 0,10 -2,2 -10,0 -2,-2" fill="#ffffff" transform="translate(0, -60) scale(0.8)" />
  </g>
</svg>
