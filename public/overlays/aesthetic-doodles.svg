<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <filter id="doodleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#f43f5e" flood-opacity="0.35" />
    </filter>
  </defs>

  <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" filter="url(#doodleGlow)">
    <!-- Top-Left Cute Winged Heart -->
    <g transform="translate(80, 75) scale(0.9)">
      <!-- Heart -->
      <path d="M 0 5 C -20 -20 -40 5 0 35 C 40 5 20 -20 0 5 Z" fill="#fda4af" fill-opacity="0.5" />
      <!-- Left Wing -->
      <path d="M -25 0 Q -55 -15 -70 5 Q -55 20 -30 18" />
      <path d="M -30 10 Q -50 5 -60 22 Q -45 28 -25 25" />
      <!-- Right Wing -->
      <path d="M 25 0 Q 55 -15 70 5 Q 55 20 30 18" />
      <path d="M 30 10 Q 50 5 60 22 Q 45 28 25 25" />
      <!-- Sparkle above -->
      <path d="M 0 -15 L 0 -30 M -8 -22 L 8 -22" />
    </g>

    <!-- Top-Right "xoxo" & Star Doodle -->
    <g transform="translate(480, 70)">
      <!-- Star doodle -->
      <path d="M 0 -22 L 6 -6 L 22 0 L 6 6 L 0 22 L -6 6 L -22 0 L -6 -6 Z" fill="#fef08a" fill-opacity="0.6" />
      <!-- Little spiral -->
      <path d="M 40 -15 A 10 10 0 1 0 40 5 A 5 5 0 1 0 40 -5" stroke-width="2.5" />
      <!-- Text "xoxo" -->
      <text x="-40" y="45" font-family="'Comic Sans MS', cursive, sans-serif" font-size="22" font-weight="900" fill="#fbcfe8" stroke="#f43f5e" stroke-width="1.5">★ xoxo ★</text>
    </g>

    <!-- Left Border Doodles (Swirls & Sparkles) -->
    <g transform="translate(45, 300)">
      <path d="M 0 0 C 25 -20 35 20 5 40 C -15 55 10 80 25 65" />
      <!-- Mini Heart -->
      <path d="M 20 120 C 10 105 -5 120 20 145 C 45 120 30 105 20 120 Z" fill="#f472b6" fill-opacity="0.6" stroke-width="2.5" />
      <path d="M 10 190 L 10 206 M 2 198 L 18 198" stroke-width="3" />
    </g>

    <!-- Right Border Doodles (Smiley Face & Lightning) -->
    <g transform="translate(545, 300)">
      <!-- Doodle Smiley -->
      <circle cx="0" cy="0" r="22" fill="#fef08a" fill-opacity="0.5" stroke-width="3" />
      <circle cx="-7" cy="-5" r="2.5" fill="#ffffff" stroke="none" />
      <circle cx="7" cy="-5" r="2.5" fill="#ffffff" stroke="none" />
      <path d="M -10 6 Q 0 16 10 6" stroke-width="2.5" />

      <!-- Mini Lightning bolt -->
      <path d="M -5 70 L 10 70 L -2 95 L 14 95 L -8 130 L -1 103 L -12 103 Z" fill="#fde047" fill-opacity="0.7" stroke-width="2" />
    </g>

    <!-- Bottom-Left Decorative Swirl & "LOVE" -->
    <g transform="translate(70, 720)">
      <!-- Swirl frame -->
      <path d="M -20 -15 Q 40 10 90 -10 Q 140 -25 150 15" stroke-width="3" />
      <!-- Mini Hearts -->
      <path d="M 50 15 C 42 5 30 17 50 35 C 70 17 58 5 50 15 Z" fill="#fda4af" fill-opacity="0.6" />
      <path d="M 95 20 C 89 12 80 22 95 36 C 110 22 101 12 95 20 Z" fill="#fda4af" fill-opacity="0.6" transform="scale(0.8)" />
    </g>

    <!-- Bottom-Right Aesthetic Film / Sparkle Doodle -->
    <g transform="translate(500, 710)">
      <path d="M -60 20 L -60 -10 L 10 -10 L 10 20 Z" stroke-dasharray="6,4" stroke-width="2.5" />
      <text x="-48" y="10" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff" stroke="none">IZIA★90s</text>
      <!-- Sparkle star -->
      <path d="M 40 15 L 44 27 L 56 31 L 44 35 L 40 47 L 36 35 L 24 31 L 36 27 Z" fill="#ffffff" stroke="none" />
    </g>
  </g>
</svg>
